name: Research Note Check

on:
  pull_request:
    branches:
      - v5
    paths:
      - "content/**"
      - ".github/workflows/research-note-check.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-note-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Quartz plugins
        run: npx quartz plugin install

      - name: Check types and style
        run: npm run check

      - name: Build Quartz
        run: npx quartz build -d docs
